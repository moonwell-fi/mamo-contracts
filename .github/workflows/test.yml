name: CI

on:
    workflow_dispatch:
    pull_request:
    push:
        branches:
            - main
env:
  FOUNDRY_PROFILE: ci
  BASE_RPC_URL: ${{secrets.BASE_RPC_URL}}
  BASESCAN_API_KEY: ${{secrets.BASESCAN_API_KEY}}
  # Fork RPC transport drops ("error sending request for url") fail a few of the parallel fork jobs per run
  FOUNDRY_FORK_RETRIES: "5"
  FOUNDRY_FORK_RETRY_BACKOFF: "2000"

jobs:
  setup:
    name: Setup and Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Node.js dependencies
        run: npm ci

      # v1.7.1 everywhere: the old pinned nightly has no Sigstore attestation, so foundryup refuses it
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Show Forge version
        run: |
          forge --version

      - name: Run Forge fmt
        run: |
          forge fmt --check
        id: fmt

      - name: Run Forge build
        run: |
          forge build --sizes
        id: build

  test:
    name: Basic Tests
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Node.js dependencies
        run: npm ci

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Run basic tests
        run: make test

  test-unit:
