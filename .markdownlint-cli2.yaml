# markdownlint-cli2 config for the docs in this repo.
#
# MD013 (line-length, default 80) is off. These documents are reference material
# built around wide tables -- contract addresses are 42 characters before the
# surrounding cells, and the ABI/param tables carry a sentence of rationale per
# row. Hard-wrapping those either breaks the table syntax outright or produces
# one-word-per-line diffs that hide the real change in review. Prose is written
# one-sentence-per-paragraph and reflows in the reader; the 80-column rule buys
# nothing here and fires on nearly every line, which trains people to ignore the
# linter entirely.
config:
  MD013: false
